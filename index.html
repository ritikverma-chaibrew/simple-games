
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rock Paper Scissors</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/script.js" defer></script>
</head>
<body>
  <main class="game">
    <h1>Rock Paper Scissors</h1>
    <p class="subtitle">Can you beat the computer?</p>

    <div class="scoreboard">
      <div>
        <h2>You</h2>
        <p id="player-score">0</p>
      </div>
      <div>
        <h2>Computer</h2>
        <p id="computer-score">0</p>
      </div>
    </div>

    <h3 id="result">Choose your move!</h3>
    <p id="moves">Make your first move below.</p>

    <div class="choices">
      <button class="choice" data-choice="rock">✊<span>Rock</span></button>
      <button class="choice" data-choice="paper">✋<span>Paper</span></button>
      <button class="choice" data-choice="scissors">✌️<span>Scissors</span></button>
    </div>

    <button id="reset">Reset Game</button>
  </main>
</body>
</html>
